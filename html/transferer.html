<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>文件中转站</title>
<style>
:root {
  --navy-900: #0f172a;
  --navy-800: #1e293b;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50:  #f8fafc;

  --accent-700:  #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-line: #dbeafe;

  --danger:      #dc2626;
  --danger-soft: #fef2f2;
  --danger-line: #fecaca;

  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 1px 3px rgba(15, 23, 42, .05), 0 10px 20px -16px rgba(15, 23, 42, .28);
  --ease: .15s cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #eef2f7;
  color: var(--navy-900);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--accent-700);
  outline-offset: 1px;
  border-radius: 5px;
}

/* ================================================================ 布局 */

#container {
  height: 100vh;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 14px;
  display: flex;
  align-items: stretch;
  gap: 12px;
}

/* ================================================================ 侧栏 */

#panel {
  flex: 0 0 260px;
  width: 260px;
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(140deg, #1e293b 0%, #0f172a 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px -6px rgba(15, 23, 42, .85);
}

.brand-mark svg { width: 16px; height: 16px; }

.brand { flex: 1 1 auto; min-width: 0; }

.brand h1 {
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: .01em;
  color: var(--navy-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand p {
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--slate-400);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 状态摘要 + 折叠按钮：仅移动端出现 */
.panel-summary {
  display: none;
  flex: 0 1 auto;
  max-width: 92px;
  font-size: .74rem;
  font-weight: 600;
  color: var(--slate-500);
  background: var(--slate-100);
  border-radius: 999px;
  padding: 2px 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.panel-toggle {
  display: none;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--slate-200);
  background: #fff;
  color: var(--slate-500);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}

.panel-toggle:hover {
  background: var(--slate-50);
  color: var(--navy-800);
  border-color: var(--slate-300);
}

.panel-toggle svg {
  width: 16px;
  height: 16px;
  transition: transform .22s cubic-bezier(.4, 0, .2, 1);
}

#panel.is-expanded .panel-toggle svg { transform: rotate(180deg); }

/* 面板主体：桌面端直接展示 */
.panel-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ================================================================ 状态区 */

.status-container {
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: 7px;
  padding: 10px 12px 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: .8rem;
}

.status-label {
  color: var(--slate-500);
  font-weight: 500;
  flex: 0 0 auto;
}

.status-value {
  font-weight: 600;
  color: var(--navy-800);
  text-align: right;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#progress_sign {
  font-size: .78rem;
  color: var(--slate-600);
}

.progress-bar {
  height: 5px;
  background: var(--slate-200);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-700), #3b82f6);
  transition: width .3s cubic-bezier(.4, 0, .2, 1);
}

/* ================================================================ 上传按钮 */

#upload {
  width: 100%;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  background: var(--navy-900);
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .22);
  transition: background var(--ease), box-shadow var(--ease), transform .07s ease;
}

#upload svg { width: 14px; height: 14px; flex: 0 0 auto; }

#upload:hover {
  background: var(--navy-800);
  box-shadow: 0 8px 16px -10px rgba(15, 23, 42, .9);
}

#upload:active { transform: translateY(1px); }

.hint {
  margin-top: auto;
  font-size: .72rem;
  line-height: 1.55;
  color: var(--slate-400);
  text-align: center;
}

/* ================================================================ 文件列表 */

#filelist {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-right: 4px;
}

/* ---------- 卡片：单行约 44px ---------- */

.file-container {
  flex: 0 0 auto;
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 5px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
}

.file-container:hover {
  border-color: var(--accent-line);
  background: #fbfdff;
  box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
}

.file-container > div:first-child {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.file-icon {
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--slate-100);
  border: 1px solid var(--slate-200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  line-height: 1;
  transition: background var(--ease), border-color var(--ease);
}

.file-container:hover .file-icon {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

.file-name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: .87rem;
  font-weight: 600;
  color: var(--navy-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  opacity: .55;
  transition: opacity var(--ease);
}

.file-container:hover .file-actions,
.file-container:focus-within .file-actions {
  opacity: 1;
}

.file-actions button {
  border-radius: 6px;
  padding: 4px 11px;
  font-size: .78rem;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}

.btn-download {
  background: var(--accent-soft);
  color: var(--accent-700);
  border-color: var(--accent-line);
}

.btn-download:hover {
  background: var(--accent-700);
  border-color: var(--accent-700);
  color: #fff;
}

.btn-delete {
  background: #fff;
  color: var(--slate-500);
  border-color: var(--slate-200);
}

.btn-delete:hover {
  background: var(--danger-soft);
  border-color: var(--danger-line);
  color: var(--danger);
}

/* ================================================================ 空状态 */

.empty-state {
  flex: 1 1 auto;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background: #fff;
  border: 1px dashed var(--slate-300);
  border-radius: var(--radius);
  color: var(--slate-400);
}

.empty-state > span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 11px;
  background: var(--slate-100);
  font-size: 1.3rem;
  line-height: 1;
  margin-bottom: 12px;
}

.empty-state h3 {
  font-size: .9rem;
  font-weight: 600;
  color: var(--slate-600);
  margin-bottom: 4px;
}

.empty-state p {
  font-size: .78rem;
  color: var(--slate-400);
}

/* ================================================================ 拖放遮罩 */

#drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(238, 242, 247, .78);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .15s ease, visibility .15s ease;
  pointer-events: none;
}

body.is-dragging #drop-overlay {
  opacity: 1;
  visibility: visible;
}

.drop-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 34px 54px;
  background: #fff;
  border: 2px dashed var(--accent-700);
  border-radius: 16px;
  box-shadow: 0 24px 60px -24px rgba(15, 23, 42, .35);
  text-align: center;
  transform: scale(.97);
  transition: transform .18s cubic-bezier(.4, 0, .2, 1);
}

body.is-dragging .drop-card {
  transform: scale(1);
}

.drop-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent-700);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.drop-icon svg { width: 24px; height: 24px; }

.drop-card h3 {
  font-size: 1.1rem;
  font-weight: 650;
  color: var(--navy-900);
}

.drop-card p {
  font-size: .85rem;
  color: var(--slate-500);
}

/* ================================================================ 滚动条 */

#filelist::-webkit-scrollbar { width: 6px; }

#filelist::-webkit-scrollbar-track { background: transparent; }

#filelist::-webkit-scrollbar-thumb {
  background: var(--slate-300);
  border-radius: 999px;
}

#filelist::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

/* ================================================================ 移动端：面板移到底部并可折叠 */

@media (max-width: 780px) {
  #container {
    height: auto;
    min-height: 100vh;
    flex-direction: column;
    padding: 12px 0 calc(78px + env(safe-area-inset-bottom, 0px));
    gap: 10px;
  }

  /* 面板固定在底部，作为抽屉 */
  #panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    width: 100%;
    flex: 0 0 auto;
    border-radius: 14px 14px 0 0;
    border-bottom: none;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 30px -18px rgba(15, 23, 42, .35);
    max-height: calc(100vh - 16px);
    overflow-y: auto;
  }

  .panel-header {
    cursor: pointer;
  }

  .panel-summary,
  .panel-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* 收起：主体高度归零；展开：高度恢复 */
  .panel-body {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .28s ease, opacity .18s ease;
  }

  #panel.is-expanded .panel-body {
    max-height: 52vh;
    opacity: 1;
    overflow-y: auto;
  }

  .hint { margin-top: 0; }

  #filelist {
    overflow: visible;
    padding-right: 0;
  }

  .file-actions { opacity: 1; }

  .drop-card { padding: 28px 36px; }
}
</style>
<script type="module" src="/js/transferer.js"></script>
</head>
<body>
<div id="container">

  <aside id="panel">
    <div class="panel-header" id="panel-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>文件中转站</h1>
        <p>Temporary Transfer</p>
      </div>
      <span class="panel-summary" id="panel-summary">加载中</span>
      <button class="panel-toggle" id="panel-toggle" type="button"
              aria-expanded="false" aria-controls="panel-body" aria-label="展开或收起面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 15 6-6 6 6"/>
        </svg>
      </button>
    </div>

    <div class="panel-body" id="panel-body">
      <div class="status-container">
        <div class="status-row">
          <span class="status-label">当前状态</span>
          <span class="status-value" id="status_sign">加载中</span>
        </div>
        <div class="status-row">
          <span class="status-label">传输进度</span>
          <span class="status-value" id="progress_sign">无任务</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress_bar"></div>
        </div>
      </div>

      <button id="upload" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/>
          <path d="m7 9 5-5 5 5"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        上传新文件
      </button>

      <p class="hint">单文件不超过 20 MB<br>支持拖放上传 · 列表更新可能有延迟</p>
    </div>
  </aside>

  <main id="filelist"></main>

</div>

<!-- 拖放遮罩 -->
<div id="drop-overlay" aria-hidden="true">
  <div class="drop-card">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/>
        <path d="m7 9 5-5 5 5"/>
        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
    </div>
    <h3>释放以上传文件</h3>
    <p>单个文件，不超过 20 MB</p>
  </div>
</div>
</script>
</body>
</html>
