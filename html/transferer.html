<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文件中转站</title>
<style>
:root {
  --navy-900: #0f172a;
  --navy-800: #1e293b;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50:  #f8fafc;

  --accent-700:  #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-line: #dbeafe;

  --danger:      #dc2626;
  --danger-soft: #fef2f2;
  --danger-line: #fecaca;

  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 1px 3px rgba(15, 23, 42, .05), 0 10px 20px -16px rgba(15, 23, 42, .28);
  --ease: .15s cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #eef2f7;
  color: var(--navy-900);
  /* 字号保持正常可读，仅通过间距与内边距收紧 */
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--accent-700);
  outline-offset: 1px;
  border-radius: 5px;
}

/* ================================================================ 布局 */

#container {
  height: 100vh;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 14px;
  display: flex;
  align-items: stretch;
  gap: 12px;
}

/* ================================================================ 侧栏 */

#panel {
  flex: 0 0 260px;
  width: 260px;
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(140deg, #1e293b 0%, #0f172a 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px -6px rgba(15, 23, 42, .85);
}

.brand-mark svg { width: 16px; height: 16px; }

.brand { min-width: 0; }

.brand h1 {
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: .01em;
  color: var(--navy-900);
  white-space: nowrap;
}

.brand p {
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--slate-400);
  white-space: nowrap;
}

/* ================================================================ 状态区 */

.status-container {
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: 7px;
  padding: 10px 12px 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: .8rem;
}

.status-label {
  color: var(--slate-500);
  font-weight: 500;
  flex: 0 0 auto;
}

.status-value {
  font-weight: 600;
  color: var(--navy-800);
  text-align: right;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#progress_sign {
  font-size: .78rem;
  color: var(--slate-600);
}

.progress-bar {
  height: 5px;
  background: var(--slate-200);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-700), #3b82f6);
  transition: width .3s cubic-bezier(.4, 0, .2, 1);
}

/* ================================================================ 上传按钮 */

#upload {
  width: 100%;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  background: var(--navy-900);
  color: #fff;
  font-size: .85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .22);
  transition: background var(--ease), box-shadow var(--ease), transform .07s ease;
}

#upload svg { width: 14px; height: 14px; flex: 0 0 auto; }

#upload:hover {
  background: var(--navy-800);
  box-shadow: 0 8px 16px -10px rgba(15, 23, 42, .9);
}

#upload:active { transform: translateY(1px); }

.hint {
  margin-top: auto;
  font-size: .72rem;
  line-height: 1.55;
  color: var(--slate-400);
  text-align: center;
}

/* ================================================================ 文件列表 */

#filelist {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------- 卡片：单行高度约 44px ---------- */

.file-container {
  flex: 0 0 auto;
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  /* 垂直内边距很小，靠行高撑出可读高度 */
  padding: 5px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
}

.file-container:hover {
  border-color: var(--accent-line);
  background: #fbfdff;
  box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
}

/* 左侧信息区（JS 生成的是「匿名 div > .file-icon + .file-name」） */
.file-container > div:first-child {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ---------- 图标：小而不失辨识度 ---------- */

.file-icon {
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--slate-100);
  border: 1px solid var(--slate-200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  line-height: 1;
  transition: background var(--ease), border-color var(--ease);
}

.file-container:hover .file-icon {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}

/* ---------- 文件名：字号正常，仅做溢出省略 ---------- */

.file-name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: .87rem;
  font-weight: 600;
  color: var(--navy-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- 操作区：默认淡出，悬停显现（进一步省视觉空间） ---------- */

.file-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  opacity: .55;
  transition: opacity var(--ease);
}

.file-container:hover .file-actions,
.file-container:focus-within .file-actions {
  opacity: 1;
}

.file-actions button {
  border-radius: 6px;
  padding: 4px 11px;
  font-size: .78rem;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--ease), color var(--ease),
              border-color var(--ease);
}

.btn-download {
  background: var(--accent-soft);
  color: var(--accent-700);
  border-color: var(--accent-line);
}

.btn-download:hover {
  background: var(--accent-700);
  border-color: var(--accent-700);
  color: #fff;
}

.btn-delete {
  background: #fff;
  color: var(--slate-500);
  border-color: var(--slate-200);
}

.btn-delete:hover {
  background: var(--danger-soft);
  border-color: var(--danger-line);
  color: var(--danger);
}

/* ================================================================ 空状态 */

.empty-state {
  flex: 1 1 auto;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background: #fff;
  border: 1px dashed var(--slate-300);
  border-radius: var(--radius);
  color: var(--slate-400);
}

.empty-state > span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 11px;
  background: var(--slate-100);
  font-size: 1.3rem;
  line-height: 1;
  margin-bottom: 12px;
}

.empty-state h3 {
  font-size: .9rem;
  font-weight: 600;
  color: var(--slate-600);
  margin-bottom: 4px;
}

.empty-state p {
  font-size: .78rem;
  color: var(--slate-400);
}

/* ================================================================ 滚动条 */

#filelist::-webkit-scrollbar { width: 6px; }

#filelist::-webkit-scrollbar-track { background: transparent; }

#filelist::-webkit-scrollbar-thumb {
  background: var(--slate-300);
  border-radius: 999px;
}

#filelist::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

/* ================================================================ 响应式 */

@media (max-width: 780px) {
  #container {
    height: auto;
    min-height: 100vh;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
  }

  #panel {
    flex: 0 0 auto;
    width: 100%;
  }

  .hint { margin-top: 0; }

  #filelist {
    overflow: visible;
    padding-right: 0;
  }

  /* 窄屏：操作区恢复常显，因为触摸没有 hover */
  .file-actions { opacity: 1; }
}
</style>
<script type="module" src="/js/transferer.js"></script>
</head>
<body>
<div id="container">

  <aside id="panel">
    <div class="panel-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>文件中转站</h1>
        <p>Temporary Transfer</p>
      </div>
    </div>

    <div class="status-container">
      <div class="status-row">
        <span class="status-label">当前状态</span>
        <span class="status-value" id="status_sign">加载中</span>
      </div>
      <div class="status-row">
        <span class="status-label">传输进度</span>
        <span class="status-value" id="progress_sign">无任务</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress_bar"></div>
      </div>
    </div>

    <button id="upload" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/>
        <path d="m7 9 5-5 5 5"/>
        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      上传新文件
    </button>

    <p class="hint">单文件不超过 20 MB<br>列表更新可能有延迟</p>
  </aside>

  <main id="filelist"></main>

</div>
</body>
</html>
