<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文件中转站</title>
<style>
:root {
  --navy-900: #0f172a;
  --navy-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50:  #f8fafc;

  --accent:      #2563eb;
  --accent-700:  #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-line: #dbeafe;

  --danger:      #dc2626;
  --danger-soft: #fef2f2;
  --danger-line: #fecaca;

  --success: #059669;

  --radius: 12px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 1px 3px rgba(15, 23, 42, .05), 0 18px 34px -22px rgba(15, 23, 42, .30);
  --shadow-lift: 0 1px 3px rgba(15, 23, 42, .06), 0 16px 32px -22px rgba(37, 99, 235, .55);
  --ease: .18s cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #eef2f7;
  color: var(--navy-900);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ---------------------------------------------------------------- 布局 */

#container {
  height: 100vh;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px;
  display: flex;
  align-items: stretch;
  gap: 22px;
}

/* ---------------------------------------------------------------- 侧栏 */

#panel {
  flex: 0 0 300px;
  width: 300px;
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(140deg, #1e293b 0%, #0f172a 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px -8px rgba(15, 23, 42, .8);
}

.brand-mark svg { width: 20px; height: 20px; }

.brand { min-width: 0; }

.brand h1 {
  font-size: .98rem;
  font-weight: 650;
  letter-spacing: .01em;
  color: var(--navy-900);
}

.brand p {
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--slate-400);
}

/* ---------------------------------------------------------------- 状态 */

.status-container {
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: 10px;
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: .8rem;
}

.status-label {
  color: var(--slate-500);
  font-weight: 500;
  flex: 0 0 auto;
}

.status-value {
  font-weight: 600;
  color: var(--navy-800);
  text-align: right;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#status_sign { transition: color var(--ease); }
#status_sign[data-status="done"]         { color: var(--success); }
#status_sign[data-status="uploading"],
#status_sign[data-status="downloading"]  { color: var(--accent-700); }
#status_sign[data-status="deleting"]     { color: var(--danger); }
#status_sign[data-status="getting_list"],
#status_sign[data-status="error"]        { color: var(--slate-500); }

#progress_sign {
  font-size: .76rem;
  color: var(--slate-600);
  font-weight: 600;
}

.progress-bar {
  height: 6px;
  background: var(--slate-200);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 1px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-700), #3b82f6);
  transition: width .35s cubic-bezier(.4, 0, .2, 1);
}

/* ---------------------------------------------------------------- 上传按钮 */

#upload {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  background: var(--navy-900);
  color: #fff;
  font-size: .88rem;
  font-weight: 600;
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .22);
  transition: background var(--ease), box-shadow var(--ease), transform .08s ease;
}

#upload svg { width: 16px; height: 16px; }

#upload:hover {
  background: var(--navy-800);
  box-shadow: 0 10px 22px -12px rgba(15, 23, 42, .85);
}

#upload:active { transform: translateY(1px); }

.hint {
  margin-top: auto;
  font-size: .7rem;
  line-height: 1.7;
  color: var(--slate-400);
  text-align: center;
}

/* ---------------------------------------------------------------- 文件列表 */

#filelist {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-right: 6px;
}

.file-container {
  background: #fff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
}

.file-container:hover {
  border-color: var(--accent-line);
  box-shadow: var(--shadow-lift);
  transform: translateY(-2px);
}

.file-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
}

.file-icon {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: var(--slate-100);
  border: 1px solid var(--slate-200);
  color: var(--slate-500);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}

.file-icon svg { width: 18px; height: 18px; }

.file-container:hover .file-icon {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-700);
}

.file-meta { min-width: 0; }

.file-name {
  font-size: .92rem;
  font-weight: 600;
  color: var(--navy-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-sub {
  font-size: .72rem;
  color: var(--slate-400);
  letter-spacing: .02em;
}

.file-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.file-actions button {
  border-radius: 8px;
  padding: 7px 14px;
  font-size: .78rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--ease), color var(--ease),
              border-color var(--ease), box-shadow var(--ease);
}

.file-actions button svg { width: 14px; height: 14px; }

.btn-download {
  background: var(--accent-soft);
  color: var(--accent-700);
  border-color: var(--accent-line);
}

.btn-download:hover {
  background: var(--accent-700);
  border-color: var(--accent-700);
  color: #fff;
  box-shadow: 0 8px 18px -12px rgba(29, 78, 216, .95);
}

.btn-delete {
  background: #fff;
  color: var(--slate-500);
  border-color: var(--slate-200);
}

.btn-delete:hover {
  background: var(--danger-soft);
  border-color: var(--danger-line);
  color: var(--danger);
}

/* ---------------------------------------------------------------- 空状态 */

.empty-state {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
  background: #fff;
  border: 1px dashed var(--slate-300);
  border-radius: var(--radius);
  color: var(--slate-400);
}

.empty-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--slate-100);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--slate-400);
  margin-bottom: 16px;
}

.empty-icon svg { width: 26px; height: 26px; }

.empty-state h3 {
  font-size: .98rem;
  font-weight: 600;
  color: var(--slate-600);
  margin-bottom: 6px;
}

.empty-state p {
  font-size: .8rem;
  color: var(--slate-400);
}

/* ---------------------------------------------------------------- 滚动条 */

#filelist::-webkit-scrollbar { width: 8px; }

#filelist::-webkit-scrollbar-track { background: transparent; }

#filelist::-webkit-scrollbar-thumb {
  background: var(--slate-300);
  border-radius: 999px;
  border: 2px solid #eef2f7;
}

#filelist::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

/* ---------------------------------------------------------------- 响应式 */

@media (max-width: 860px) {
  #container {
    height: auto;
    min-height: 100vh;
    flex-direction: column;
    padding: 20px 16px;
    gap: 16px;
  }

  #panel {
    flex: 0 0 auto;
    width: 100%;
  }

  .hint { margin-top: 0; }

  #filelist { overflow: visible; padding-right: 0; }

  .file-container { flex-wrap: wrap; }

  .file-main { flex: 1 1 100%; }

  .file-actions {
    width: 100%;
    justify-content: flex-end;
  }
}
</style>
<script type="module" src="/js/transferer.js"></script>
</head>
<body>
<div id="container">

  <aside id="panel">
    <div class="panel-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>文件中转站</h1>
        <p>Temporary Transfer</p>
      </div>
    </div>

    <div class="status-container">
      <div class="status-row">
        <span class="status-label">当前状态</span>
        <span class="status-value" id="status_sign">加载中</span>
      </div>
      <div class="status-row">
        <span class="status-label">传输进度</span>
        <span class="status-value" id="progress_sign">无任务</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress_bar"></div>
      </div>
    </div>

    <button id="upload" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/>
        <path d="m7 9 5-5 5 5"/>
        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      上传新文件
    </button>

    <p class="hint">单文件不超过 20 MB<br>列表更新可能有延迟</p>
  </aside>

  <main id="filelist"></main>

</div>
</body>
</html>
