<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Whiteboard · 共享白板</title>
<style>
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --ink:#1b2530;
    --muted:#64748b;
    --line:#dde3ea;
    --brand:#1e4e79;
    --brand-strong:#16395a;
    --ring:rgba(30,78,121,.15);
    --ok:#16a34a;
    --warn:#d97706;
    --err:#dc2626;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 顶部栏 ===== */
  .topbar{
    position:relative;
    z-index:10;               /* 保证 tooltip 浮于编辑区之上 */
    flex:none;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
  }
  .topbar-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:38px;height:38px;
    flex:none;
    border-radius:9px;
    background:linear-gradient(135deg,#1e4e79,#3479b5);
    color:#fff;
    display:grid;place-items:center;
    font-weight:700;
    font-size:16px;
    letter-spacing:.5px;
    box-shadow:0 2px 6px -2px rgba(16,42,67,.5);
  }
  .title-group{min-width:0;}
  .title{
    margin:0;
    font-size:16px;
    font-weight:600;
    letter-spacing:.3px;
  }
  .subtitle{
    margin:2px 0 0;
    font-size:12px;
    color:var(--muted);
  }

  /* ===== Tooltip（位于顶栏右侧） ===== */
  .tip{
    position:relative;
    margin-left:auto;         /* 推到顶栏最右 */
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;height:22px;
    flex:none;
    border-radius:50%;
    border:1px solid #c6d0db;
    color:var(--muted);
    background:#fff;
    font-size:12px;
    font-weight:700;
    font-style:normal;
    line-height:1;
    cursor:help;
    user-select:none;
    transition:border-color .15s, color .15s, box-shadow .15s;
  }
  .tip:hover,
  .tip:focus-visible{
    outline:none;
    border-color:var(--brand);
    color:var(--brand);
    box-shadow:0 0 0 3px var(--ring);
  }

  .tip-bubble{
    position:absolute;
    top:calc(100% + 12px);
    right:-4px;
    z-index:30;
    width:max-content;
    max-width:min(280px, calc(100vw - 40px));
    padding:9px 12px;
    border-radius:6px;
    background:#1b2530;
    color:#f2f5f8;
    font-size:12px;
    font-weight:400;
    line-height:1.65;
    text-align:left;
    letter-spacing:.2px;
    box-shadow:0 8px 20px -8px rgba(16,42,67,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .tip-bubble::before{
    content:"";
    position:absolute;
    top:-5px;
    right:14px;
    width:10px;height:10px;
    background:#1b2530;
    transform:rotate(45deg);
    border-radius:1px;
  }
  .tip:hover .tip-bubble,
  .tip:focus-visible .tip-bubble,
  .tip:focus .tip-bubble{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  /* ===== 主体 ===== */
  main{
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    padding:24px;
  }
  .container{
    width:100%;
    max-width:1200px;
    min-height:0;
    display:flex;
  }

  .card{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(16,42,67,.05),
               0 14px 30px -22px rgba(16,42,67,.45);
    overflow:hidden;
  }

  .card-body{
    flex:1;
    min-height:0;
    display:flex;
    padding:18px;
  }

  #wb{
    flex:1;
    min-height:140px;
    width:100%;
    resize:none;
    margin:0;
    padding:16px 18px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    line-height:1.75;
    transition:border-color .15s, box-shadow .15s;
  }
  #wb::placeholder{color:#a8b3c1;}
  #wb:hover{border-color:#c6d0db;}
  #wb:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px var(--ring);
  }

  /* ===== 底部工具栏 ===== */
  .toolbar{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 18px;
    border-top:1px solid var(--line);
    background:#fafbfc;
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    min-width:0;
  }
  .dot{
    width:8px;height:8px;
    flex:none;
    border-radius:50%;
    background:#9aa7b6;
    transition:background .2s;
  }
  .dot.busy{background:var(--warn);animation:pulse 1s ease-in-out infinite;}
  .dot.ok{background:var(--ok);}
  .dot.err{background:var(--err);}
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.45;transform:scale(.8);}
  }
  #statu{
    color:var(--ink);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .actions{
    display:flex;
    gap:10px;
    flex:none;
  }
  .btn{
    border:1px solid transparent;
    border-radius:6px;
    padding:9px 20px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.3px;
    cursor:pointer;
    transition:background .15s, border-color .15s, box-shadow .15s, transform .05s;
  }
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px var(--ring);
  }
  .btn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .btn-primary{
    background:var(--brand);
    color:#fff;
    box-shadow:0 1px 2px rgba(16,42,67,.25);
  }
  .btn-primary:hover:not(:disabled){background:var(--brand-strong);}

  .btn-ghost{
    background:#fff;
    border-color:var(--line);
    color:#33414f;
  }
  .btn-ghost:hover:not(:disabled){
    background:#f4f7fa;
    border-color:#bcc9d6;
  }

  /* ===== 响应式：窄屏 ===== */
  @media (max-width:640px){
    .topbar{padding:12px 16px;}
    .subtitle{display:none;}

    /* 编辑区完全撑满宽度 */
    main{
      padding:0;
    }
    .container{
      max-width:none;
    }
    .card{
      border:none;
      border-radius:0;
      box-shadow:none;
    }
    .card-body{
      padding:12px;
    }
    #wb{
      border-radius:6px;
    }

    /* 工具栏纵向排列 */
    .toolbar{
      flex-direction:column;
      align-items:stretch;
      gap:12px;
      padding:12px;
    }

    /* 按钮组撑满整行宽度 */
    .actions{
      width:100%;
      gap:10px;
    }
    .actions .btn{
      flex:1 1 0;
      width:100%;
      min-width:0;
      padding:11px 12px;
    }

    /* 顶栏 tooltip 适配 */
    .tip-bubble{
      right:-2px;
      max-width:calc(100vw - 32px);
    }
    .tip-bubble::before{right:10px;}
  }
</style>
<script>
addEventListener('load', _ => {

  const url = '/kv?key=whiteboard';
  const wb        = document.getElementById('wb');
  const statu     = document.getElementById('statu');
  const dot       = document.getElementById('dot');
  const submitBtn = document.getElementById('submit');
  const loadBtn   = document.getElementById('download');

  function setStatus(text, state){
    statu.textContent = text;
    dot.className = 'dot' + (state ? ' ' + state : '');
  }
  function setBusy(busy){
    submitBtn.disabled = busy;
    loadBtn.disabled   = busy;
  }

  async function getContent(){
    setStatus('加载中…', 'busy');
    setBusy(true);
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      wb.value = await res.text();
      setStatus('已加载', 'ok');
    }catch(err){
      console.error(err);
      setStatus('加载失败', 'err');
    }finally{
      setBusy(false);
    }
  }

  async function postContent(){
    setStatus('提交中…', 'busy');
    setBusy(true);
    try{
      const res = await fetch(url + '&mode=set', {method:'POST', body: wb.value});
      const txt = await res.text();
      console.log(txt);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('已提交', 'ok');
    }catch(err){
      console.error(err);
      setStatus('提交失败', 'err');
    }finally{
      setBusy(false);
    }
  }

  loadBtn.addEventListener('click', getContent);
  submitBtn.addEventListener('click', postContent);

  getContent();
});
</script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">W</div>
      <div class="title-group">
        <h1 class="title">Whiteboard 共享白板</h1>
        <p class="subtitle">统一编辑 · 云端同步</p>
      </div>
      <span class="tip" tabindex="0" role="button" aria-label="查看操作提示">
        i
        <span class="tip-bubble" role="tooltip">
          这是一块所有用户共享的白板，同一时间只有一份内容。<br>
          点击「提交」会用你的版本覆盖云端内容，全员可见；<br>
          点击「加载」拉取最新版本（会丢弃未提交的修改）。
        </span>
      </span>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="card">
        <div class="card-body">
          <textarea id="wb" spellcheck="false" placeholder="在此输入白板内容…"></textarea>
        </div>

        <div class="toolbar">
          <div class="status">
            <span class="dot" id="dot"></span>
            <span>当前状态</span>
            <span id="statu">就绪</span>
          </div>
          <div class="actions">
            <button id="download" class="btn btn-ghost">加载</button>
            <button id="submit" class="btn btn-primary">提交</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
